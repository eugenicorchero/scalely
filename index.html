<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scalely - Pràctica d'Escales</title>
    <style>
        :root {
            --bg-main: #222222;
            --bg-card: #1D1851;
            --text-main: #FFFFFF;
            --text-muted: #B0B0C0;
            --accent: #FF5B77;
            --accent-hover: #ff3b5c;
            --success: #00E676;
            --error: #FF1744;
            --note-btn-bg: #2C2663;
            --note-btn-active: #FF5B77;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-badge {
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
        }

        .prompt-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .prompt-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .scale-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .scale-title span {
            color: var(--accent);
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--text-main);
        }

        .selection-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: auto 0;
        }

        .slots-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            min-height: 52px;
            width: 100%;
        }

        .note-slot {
            width: 58px;
            height: 50px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.06);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            color: var(--text-main);
        }

        .note-slot.filled {
            background-color: var(--bg-card);
            border: 2px solid var(--accent);
            animation: popIn 0.15s ease-out;
        }

        .note-slot.correct {
            background-color: rgba(0, 230, 118, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .note-slot.wrong {
            background-color: rgba(255, 23, 68, 0.2);
            border-color: var(--error);
            color: var(--error);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        .feedback-msg {
            min-height: 24px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
        }

        .actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-clear {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            flex: 0.4;
        }

        .btn-check {
            background-color: var(--accent);
            color: var(--text-main);
        }

        .btn-next {
            background-color: var(--success);
            color: #111;
            display: none;
        }

        /* Panell de notes plana (mateixa jerarquia, disseny responsive i tàctil optimitzat) */
        .palette-wrapper {
            background-color: #111;
            padding: 14px 10px 20px 10px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
        }

        .note-btn {
            background-color: var(--note-btn-bg);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 4px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.08s;
        }

        .note-btn:active {
            transform: scale(0.95);
            background-color: var(--accent);
        }

        .note-btn.selected {
            background-color: var(--accent);
            border-color: #ff8fa3;
            box-shadow: 0 0 10px rgba(255, 91, 119, 0.4);
        }

        @media (min-width: 500px) {
            .palette-grid {
                grid-template-columns: repeat(12, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Scale<span>ly</span></div>
        <div class="stats">
            <div class="stat-badge">🔥 <span id="streak">0</span></div>
            <div class="stat-badge">✅ <span id="score">0</span>/<span id="total">0</span></div>
        </div>
    </header>

    <main>
        <div class="prompt-card">
            <div class="prompt-label">Construeix l'escala de</div>
            <div class="scale-title" id="scale-prompt">Do <span>Major</span></div>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="all">Totes</button>
                <button class="mode-btn" data-mode="major">Només Majors</button>
                <button class="mode-btn" data-mode="minor">Només Menors</button>
            </div>
        </div>

        <div class="selection-area">
            <div class="slots-container" id="slots-container"></div>
            <div class="feedback-msg" id="feedback-msg"></div>
        </div>

        <div class="actions">
            <button class="btn btn-clear" id="btn-clear">Esborrar</button>
            <button class="btn btn-check" id="btn-check">Comprovar</button>
            <button class="btn btn-next" id="btn-next">Següent Escala →</button>
        </div>
    </main>

    <div class="palette-wrapper">
        <div class="palette-grid" id="palette-grid">
            <!-- Es generen per JS les 12 notes en igualtat de condicions -->
        </div>
    </div>

    <script>
        // Llista oficial neta d'escales netes (evitant tonalitats extremadament enharmòniques o amb dobles sostinguts)
        const CLEAN_SCALES = [
            // Majors netes
            { root: "Do", type: "major", notes: ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"] },
            { root: "Sol", type: "major", notes: ["Sol", "La", "Si", "Do", "Re", "Mi", "Fa#"] },
            { root: "Re", type: "major", notes: ["Re", "Mi", "Fa#", "Sol", "La", "Si", "Do#"] },
            { root: "La", type: "major", notes: ["La", "Si", "Do#", "Re", "Mi", "Fa#", "Sol#"] },
            { root: "Mi", type: "major", notes: ["Mi", "Fa#", "Sol#", "La", "Si", "Do#", "Re#"] },
            { root: "Si", type: "major", notes: ["Si", "Do#", "Re#", "Mi", "Fa#", "Sol#", "La#"] },
            { root: "Fa", type: "major", notes: ["Fa", "Sol", "La", "Sib", "Do", "Re", "Mi"] },
            { root: "Sib", type: "major", notes: ["Sib", "Do", "Re", "Mib", "Fa", "Sol", "La"] },
            { root: "Mib", type: "major", notes: ["Mib", "Fa", "Sol", "Lab", "Sib", "Do", "Re"] },
            
            // Menors naturals netes
            { root: "La", type: "minor", notes: ["La", "Si", "Do", "Re", "Mi", "Fa", "Sol"] },
            { root: "Mi", type: "minor", notes: ["Mi", "Fa#", "Sol", "La", "Si", "Do", "Re"] },
            { root: "Si", type: "minor", notes: ["Si", "Do#", "Re", "Mi", "Fa#", "Sol", "La"] },
            { root: "Fa#", type: "minor", notes: ["Fa#", "Sol#", "La", "Si", "Do#", "Re", "Mi"] },
            { root: "Do#", type: "minor", notes: ["Do#", "Re#", "Mi", "Fa#", "Sol#", "La", "Si"] },
            { root: "Re", type: "minor", notes: ["Re", "Mi", "Fa", "Sol", "La", "Sib", "Do"] },
            { root: "Sol", type: "minor", notes: ["Sol", "La", "Sib", "Do", "Re", "Mib", "Fa"] },
            { root: "Do", type: "minor", notes: ["Do", "Re", "Mib", "Fa", "Sol", "Lab", "Sib"] }
        ];

        // Totes les 12 notes disponibles en la mateixa jerarquia per a la selecció de l'usuari
        const ALL_NOTES = ["Do", "Do#", "Reb", "Re", "Re#", "Mib", "Mi", "Fa", "Fa#", "Solb", "Sol", "Sol#", "Lab", "La", "La#", "Sib", "Si"];
        // Nota: Agrupem o llistem les essencials de manera plana
        const PALETTE_NOTES = ["Do", "Do#", "Reb", "Re", "Re#", "Mib", "Mi", "Fa", "Fa#", "Solb", "Sol", "Sol#", "Lab", "La", "La#", "Sib", "Si"];

        let currentScale = CLEAN_SCALES[0];
        let selectedNotes = [];
        let filterMode = "all";
        let isAnswered = false;
        let stats = { streak: 0, score: 0, total: 0 };

        // Generar la graella plana de botons de notes
        function renderPalette() {
            const grid = document.getElementById("palette-grid");
            grid.innerHTML = "";
            
            PALETTE_NOTES.forEach(note => {
                const btn = document.createElement("button");
                btn.className = "note-btn";
                btn.textContent = note;
                
                if (selectedNotes.includes(note)) {
                    btn.classList.add("selected");
                }

                btn.onclick = () => handleNoteClick(note);
                grid.appendChild(btn);
            });
        }

        function handleNoteClick(note) {
            if (isAnswered) return;

            const existingIndex = selectedNotes.indexOf(note);
            if (existingIndex !== -1) {
                // Toggle: si ja estava seleccionada, l'esborrem
                selectedNotes.splice(existingIndex, 1);
            } else {
                // Evitar duplicar exactament la mateixa nota o demanar més de 7
                if (selectedNotes.length < 7) {
                    selectedNotes.push(note);
                }
            }

            renderSlots();
            renderPalette();
        }

        function generateNewScale() {
            isAnswered = false;
            selectedNotes = [];

            // Filtrar segons el mode seleccionat
            let pool = CLEAN_SCALES;
            if (filterMode === "major") {
                pool = CLEAN_SCALES.filter(s => s.type === "major");
            } else if (filterMode === "minor") {
                pool = CLEAN_SCALES.filter(s => s.type === "minor");
            }

            // Triar una escala aleatòria diferent de l'actual
            let newObj;
            do {
                newObj = pool[Math.floor(Math.random() * pool.length)];
            } while (newObj === currentScale && pool.length > 1);

            currentScale = newObj;

            const typeText = currentScale.type === "major" ? "Major" : "Menor";
            document.getElementById("scale-prompt").innerHTML = `${currentScale.root} <span>${typeText}</span>`;
            document.getElementById("feedback-msg").textContent = "";
            
            document.getElementById("btn-check").style.display = "block";
            document.getElementById("btn-clear").style.display = "block";
            document.getElementById("btn-next").style.display = "none";

            renderSlots();
            renderPalette();
        }

        function renderSlots() {
            const container = document.getElementById("slots-container");
            container.innerHTML = "";

            for (let i = 0; i < 7; i++) {
                const slot = document.createElement("div");
                slot.className = "note-slot";
                
                if (selectedNotes[i]) {
                    slot.textContent = selectedNotes[i];
                    slot.classList.add("filled");

                    if (isAnswered) {
                        // Comprovació estricta amb la nota de l'escala escollida
                        if (selectedNotes[i] === currentScale.notes[i]) {
                            slot.classList.add("correct");
                        } else {
                            slot.classList.add("wrong");
                        }
                    } else {
                        // Clicar a sobre d'una casella l'esborra directament
                        slot.onclick = () => {
                            selectedNotes.splice(i, 1);
                            renderSlots();
                            renderPalette();
                        };
                    }
                } else {
                    slot.textContent = i + 1;
                    slot.style.color = "rgba(255,255,255,0.2)";
                    slot.style.fontSize = "0.8rem";
                }
                container.appendChild(slot);
            }
        }

        function checkAnswer() {
            if (selectedNotes.length < 7) {
                const msg = document.getElementById("feedback-msg");
                msg.style.color = "#FFD54F";
                msg.textContent = `Falten ${7 - selectedNotes.length} notes per completar l'escala.`;
                return;
            }

            isAnswered = true;
            stats.total++;

            const isCorrect = selectedNotes.every((note, idx) => note === currentScale.notes[idx]);
            const msg = document.getElementById("feedback-msg");

            if (isCorrect) {
                stats.score++;
                stats.streak++;
                msg.style.color = "var(--success)";
                msg.textContent = "Molt bé! Escala correcta 🎉";
            } else {
                stats.streak = 0;
                msg.style.color = "var(--error)";
                msg.textContent = `Solució correcta: ${currentScale.notes.join(" - ")}`;
            }

            document.getElementById("streak").textContent = stats.streak;
            document.getElementById("score").textContent = stats.score;
            document.getElementById("total").textContent = stats.total;

            document.getElementById("btn-check").style.display = "none";
            document.getElementById("btn-clear").style.display = "none";
            document.getElementById("btn-next").style.display = "block";

            renderSlots();
            renderPalette();
        }

        document.getElementById("btn-clear").addEventListener("click", () => {
            if (isAnswered) return;
            selectedNotes = [];
            document.getElementById("feedback-msg").textContent = "";
            renderSlots();
            renderPalette();
        });

        document.getElementById("btn-check").addEventListener("click", checkAnswer);
        document.getElementById("btn-next").addEventListener("click", generateNewScale);

        document.querySelectorAll(".mode-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filterMode = btn.dataset.mode;
                generateNewScale();
            });
        });

        // Inicialitzar
        generateNewScale();
    </script>
</body>
</html>
